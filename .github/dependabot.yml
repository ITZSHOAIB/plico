version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases settle before proposing them. Security updates are not delayed.
    cooldown:
      default-days: 3
    ignore:
      # OTel SDK 2.x peers on @opentelemetry/api <1.10. A newer API minor in the runtime than the
      # host registers makes the global API reject it, so Plico spans fall back to a no-op tracer.
      - dependency-name: "@opentelemetry/api"
        update-types: ["version-update:semver-minor"]
      # Stay on the OTel SDK 2.x line: 3.x requires @opentelemetry/api 1.10, which hosts on the
      # 2.x SDK cannot register. Move together with the API when that changes.
      - dependency-name: "@opentelemetry/context-async-hooks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opentelemetry/sdk-trace-base"
        update-types: ["version-update:semver-major"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      # One weekly PR, majors included, so a single merge and approval covers every update.
      weekly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major, minor, patch]
