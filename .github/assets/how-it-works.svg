<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">How Plico works</title>
  <desc id="d">A project folder runs through the Plico runtime, which writes one event log. Studio, the HTTP API, evals and tracing all read that log.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#62bfa8"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: Inter, 'Segoe UI', Arial, Helvetica, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>
  <rect width="1280" height="400" rx="20" fill="#0b0d0d"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="19.5" fill="none" stroke="#262c2b"/>

  <!-- step 1: project -->
  <g transform="translate(48 70)">
    <rect width="300" height="260" rx="14" fill="#111414" stroke="#262c2b"/>
    <text x="24" y="40" class="sans" font-size="13" font-weight="600" letter-spacing="1.5" fill="#62bfa8">1  YOU WRITE</text>
    <text x="24" y="82" class="mono" font-size="17" fill="#e7ecea">agent.md</text>
    <text x="24" y="114" class="mono" font-size="17" fill="#e7ecea">skills/*.md</text>
    <text x="24" y="146" class="mono" font-size="17" fill="#e7ecea">tools/*.tool.ts</text>
    <text x="24" y="178" class="mono" font-size="17" fill="#e7ecea">evals/*.json</text>
    <text x="24" y="210" class="mono" font-size="17" fill="#e7ecea">plico.config.ts</text>
    <text x="24" y="242" class="sans" font-size="14" fill="#818b88">Plain files, reviewed in a pull request</text>
  </g>

  <path d="M356 200H420" stroke="#62bfa8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 2: runtime -->
  <g transform="translate(428 70)">
    <rect width="300" height="260" rx="14" fill="#10261f" stroke="#62bfa8" stroke-opacity="0.55"/>
    <text x="24" y="40" class="sans" font-size="13" font-weight="600" letter-spacing="1.5" fill="#8dd4c2">2  PLICO RUNS IT</text>
    <text x="24" y="86" class="sans" font-size="18" fill="#e7ecea">Composes instructions</text>
    <text x="24" y="118" class="sans" font-size="18" fill="#e7ecea">Calls your model</text>
    <text x="24" y="150" class="sans" font-size="18" fill="#e7ecea">Runs your tools</text>
    <text x="24" y="182" class="sans" font-size="18" fill="#e7ecea">Pauses for approval</text>
    <text x="24" y="242" class="sans" font-size="14" fill="#a0aaa7">With the model provider you choose</text>
  </g>

  <path d="M736 200H800" stroke="#62bfa8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 3: event log -->
  <g transform="translate(808 70)">
    <rect width="190" height="260" rx="14" fill="#111414" stroke="#262c2b"/>
    <text x="20" y="40" class="sans" font-size="13" font-weight="600" letter-spacing="1.5" fill="#62bfa8">3  ONE LOG</text>
    <g class="mono" font-size="13" fill="#a0aaa7">
      <text x="20" y="80">run.started</text>
      <text x="20" y="104" fill="#8dd4c2">tool.call</text>
      <text x="20" y="128" fill="#e0a95a">approval.requested</text>
      <text x="20" y="152" fill="#8dd4c2">tool.result</text>
      <text x="20" y="176">artifact.file.written</text>
      <text x="20" y="200" fill="#a3cf6e">run.completed</text>
    </g>
    <text x="20" y="242" class="sans" font-size="14" fill="#818b88">Durable and replayable</text>
  </g>

  <!-- fan out -->
  <g stroke="#62bfa8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M1004 200H1040V110H1068"/>
    <path d="M1004 200H1040V163H1068"/>
    <path d="M1004 200H1040V237H1068"/>
    <path d="M1004 200H1040V290H1068"/>
  </g>
  <g class="sans" font-size="17" fill="#e7ecea">
    <g transform="translate(1076 90)"><rect width="156" height="40" rx="10" fill="#111414" stroke="#262c2b"/><text x="16" y="26">Studio</text></g>
    <g transform="translate(1076 143)"><rect width="156" height="40" rx="10" fill="#111414" stroke="#262c2b"/><text x="16" y="26">HTTP API</text></g>
    <g transform="translate(1076 217)"><rect width="156" height="40" rx="10" fill="#111414" stroke="#262c2b"/><text x="16" y="26">Evals in CI</text></g>
    <g transform="translate(1076 270)"><rect width="156" height="40" rx="10" fill="#111414" stroke="#262c2b"/><text x="16" y="26">OpenTelemetry</text></g>
  </g>
  <text x="1076" y="64" class="sans" font-size="13" font-weight="600" letter-spacing="1.5" fill="#62bfa8">4  READ BY</text>
</svg>
