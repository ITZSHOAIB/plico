name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22.18.0 is the engines floor; 24 is the current LTS line.
        node: ["22.18.0", 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Verify built package entry points
        run: |
          node packages/cli/dist/cli.js validate examples/internal-ops-agent
          node packages/cli/dist/cli.js run --dry --script examples/internal-ops-agent/evals/smoke.script.json examples/internal-ops-agent
          node scripts/verify-built-server.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        if: runner.os != 'Windows'
        run: pnpm test

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: pnpm test --maxWorkers=2

  # Installs the packed tarballs into an empty project, as a published install would.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.18.0", 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install the packed tarballs and run the CLI
        run: pnpm smoke:tarballs

      - name: Dry-run the publish script
        run: node scripts/publish-packages.mjs
        env:
          PLICO_PUBLISH_DRY_RUN: "1"
