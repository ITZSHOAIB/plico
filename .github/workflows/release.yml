name: Release
run-name: Release after CI · ${{ github.event.workflow_run.display_title || inputs.release_sha || github.sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full merge SHA of the Version Packages PR to retry (blank for main)"
        required: false
        type: string

# Queue merges instead of replacing the single pending run. Never interrupt publishing.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  context:
    name: Check main CI and release intent
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      sha: ${{ steps.context.outputs.sha }}
      publish: ${{ steps.context.outputs.publish }}
      latest: ${{ steps.context.outputs.latest }}
    steps:
      # Never download artifacts or execute code from the triggering workflow.
      - name: Verify CI and identify the merged release PR
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.release_sha || github.event.workflow_run.head_sha || github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a full commit SHA'; exit 1; }
          main=$(gh api "repos/$REPO/commits/main" --jq '.sha')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "latest=$([[ "$SHA" == "$main" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success" \
            --jq '[.workflow_runs[] | select(.head_branch == "main")] | length')
          test "$passed" -gt 0 || { echo 'Release commit must pass main CI first'; exit 1; }
          candidates=$(gh api "repos/$REPO/commits/$SHA/pulls" --paginate --jq \
            '.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == "changeset-release/main" and .head.repo.full_name == .base.repo.full_name) | .merge_commit_sha')
          pr=$(printf '%s\n' "$candidates" | grep -Fx "$SHA" || true)
          publish=false
          if test -n "$pr"; then
            candidate=$(gh api "repos/$REPO/contents/packages/cli/package.json?ref=$SHA" --jq '.content' | base64 --decode | jq -r .version)
            current=$(gh api "repos/$REPO/contents/packages/cli/package.json?ref=$main" --jq '.content' | base64 --decode | jq -r .version)
            test "$candidate" = "$current" || { echo 'A newer release supersedes this commit; refusing to move npm tags backwards'; exit 1; }
            publish=true
          elif test "$MANUAL" = true; then
            echo 'Recovery requires the merge SHA of a Version Packages PR'; exit 1
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if test "$publish" = true; then
            echo "### Publishing the reviewed release at $SHA after successful main CI" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### CI passed. Updating the Version Packages PR; no packages will be published.' >> "$GITHUB_STEP_SUMMARY"
          fi

  version-pr:
    name: Prepare Version Packages PR
    needs: context
    if: needs.context.outputs.publish == 'false' && needs.context.outputs.latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.12.4
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Open or update the Version Packages pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run CI on the Version Packages branch without a PAT
        if: steps.changesets.outputs.hasChangesets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref changeset-release/main

  publish:
    name: Publish reviewed packages to npm
    needs: context
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout the exact commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.12.4
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Do not restore build/dependency caches in the publishing job.
      - name: Update npm for trusted publishing
        run: npm install --global npm@^11.5.1 && npm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Check the packed tarballs install and run
        run: pnpm smoke:tarballs
      - name: Publish to npm
        run: pnpm publish:packages
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.context.outputs.sha }}
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists."
            exit 0
          fi
          awk -v header="## $version" '$0 == header { found = 1; next } found && /^## / { exit } found' \
            packages/cli/CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo 'Release changelog entry is missing'; exit 1; }
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          gh release create "v$version" --target "$RELEASE_SHA" --title "v$version" --notes-file release-notes.md "${flags[@]}"
          echo "### Published [v$version](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$version)" >> "$GITHUB_STEP_SUMMARY"
