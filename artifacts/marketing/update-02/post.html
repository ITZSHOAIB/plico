<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plico update card</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  /* Plico update card: one format for every release post, 1080x1350 (4:5).
     Fixed: frame and rulers, star field, top bar (mark + version), status bar.
     Per card: headline, line, visual. Content sits on the vertical centre. */
  :root {
    --bg: #0a0b0b; --line: #232928; --line-soft: #171c1b; --fg: #eef2f0; --muted: #8b9693;
    --accent: #62bfa8;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; background: var(--bg); overflow: hidden; }
  body { position: relative; font-family: "Geist", system-ui, sans-serif; color: var(--fg); }

  #stars { position: absolute; inset: 0; width: 1080px; height: 1350px; }

  /* Frame: two rails, a top rule, a ruler above the status bar, pluses at the joins. */
  .rail { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .rail.l { left: 48px; } .rail.r { right: 48px; }
  .rule { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
  .rule.top { top: 112px; } .rule.bottom { bottom: 64px; }
  .ruler { position: absolute; left: 48px; right: 48px; bottom: 64px; height: 14px;
    background:
      repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 96px) bottom / 100% 14px no-repeat,
      repeating-linear-gradient(90deg, var(--line-soft) 0 1px, transparent 1px 12px) bottom / 100% 7px no-repeat; }
  .plus { position: absolute; width: 15px; height: 15px; transform: translate(-7px, -7px); }
  .plus::before, .plus::after { content: ""; position: absolute; background: var(--muted); }
  .plus::before { left: 7px; top: 0; width: 1px; height: 15px; }
  .plus::after { top: 7px; left: 0; height: 1px; width: 15px; }

  header { position: absolute; left: 48px; right: 48px; top: 0; height: 112px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 30px; letter-spacing: -0.01em; }
  .brand svg { width: 44px; height: 44px; }
  .version { font-family: "Geist Mono", monospace; font-size: 22px; border: 1px solid var(--line);
    padding: 9px 16px; display: flex; gap: 14px; align-items: center; }
  .version b { color: var(--accent); font-weight: 500; }
  .version i { width: 1px; height: 22px; background: var(--line); }
  .version span { color: var(--muted); }

  main { position: absolute; left: 48px; right: 48px; top: 112px; bottom: 64px;
    display: flex; flex-direction: column; justify-content: center; padding: 0 40px; }

  .visual { position: relative; height: 430px; margin-bottom: 52px; }
  .visual canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .visual > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .visual.factory, .visual.evals { height: 470px; margin-bottom: 44px; }
  .tag { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 8px;
    font-size: 20px; padding: 6px 12px; background: var(--bg); border: 1px solid #3a4441; white-space: nowrap; }
  .tag svg { width: 18px; height: 18px; stroke: var(--accent); fill: none; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }

  h1 { font-size: 92px; line-height: 1.04; letter-spacing: -0.045em; font-weight: 500; }
  h1 em { font-style: normal; color: var(--accent); }
  .line { margin-top: 26px; font-size: 30px; line-height: 1.4; color: var(--muted); max-width: 820px; }
  .cmd { margin-top: 40px; display: inline-flex; align-self: flex-start; border: 1px solid var(--line);
    font-family: "Geist Mono", monospace; font-size: 22px; }
  .cmd span { padding: 14px 18px; }
  .cmd span + span { border-left: 1px solid var(--line); color: var(--muted); }
  .cmd b { color: var(--muted); font-weight: 400; margin-right: 12px; }

  footer { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex;
    align-items: stretch; justify-content: space-between; padding-left: 48px; font-size: 19px; }
  .status { display: flex; align-items: center; gap: 10px; padding-left: 20px; color: var(--muted);
    font-family: "Geist Mono", monospace; }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .tabs { display: flex; margin-right: 48px; }
  .tabs span { display: flex; align-items: center; padding: 0 20px; border-left: 1px solid var(--line); }
  .tabs span:last-child { border-right: 1px solid var(--line); }
  .tabs .on { background: var(--accent); color: #04140f; font-weight: 500; }
</style>
</head>
<body>
  <canvas id="stars" width="2160" height="2700"></canvas>
  <div class="rail l"></div><div class="rail r"></div>
  <div class="rule top"></div><div class="rule bottom"></div><div class="ruler"></div>
  <div class="plus" style="left:48px;top:112px"></div><div class="plus" style="left:1032px;top:112px"></div>
  <div class="plus" style="left:48px;top:1286px"></div><div class="plus" style="left:1032px;top:1286px"></div>

  <header>
    <div class="brand">
      <svg viewBox="0 0 104 104" aria-hidden="true"><rect width="104" height="104" rx="24" fill="#0f6e5c"/><path d="M67 11 93 37H73a6 6 0 0 1-6-6Z" fill="#62bfa8"/><text x="50" y="76" font-family="Arial, sans-serif" font-size="64" font-weight="700" text-anchor="middle" fill="#ffffff">P</text></svg>
      Plico
    </div>
    <div class="version" id="version"></div>
  </header>

  <main>
    <div class="visual" id="visual"></div>
    <h1 id="headline">Plico now supports agent evals.</h1>
    <p class="line" id="line"></p>
    <div class="cmd" id="cmd"></div>
  </main>

  <footer>
    <div class="status"><i></i><span id="status"></span></div>
    <div class="tabs" id="tabs"></div>
  </footer>

<script>
  const data = {
  "number": "02",
  "version": "0.5.1",
  "headline": "Plico now supports\n*agent evals.*",
  "line": "Score agent runs, compare baselines, and inspect failures in Studio.",
  "status": "shipped",
  "tabs": [
    "Evals",
    "Baselines",
    "Studio"
  ],
  "visual": {
    "type": "eval-forensics"
  }
}
;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  // Seeded randomness, so a card renders the same every time.
  let seed = 7;
  const rand = () => {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  };

  $("version").innerHTML = `<span>Update</span><b>${esc(data.number)}</b><i></i>v${esc(data.version)}`;
  $("headline").innerHTML = esc(data.headline).replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/\n/g, "<br>");
  $("line").textContent = data.line;
  $("cmd").innerHTML = `<span><b>$</b>${esc(data.cta ?? "npm create plico@latest")}</span><span>plico.sohab.dev</span>`;
  $("status").textContent = data.status ?? "shipped";
  $("tabs").innerHTML = ["Plico", ...(data.tabs ?? [])]
    .map((t, i) => `<span class="${i === 0 ? "on" : ""}">${esc(t)}</span>`).join("");

  // Star field: sparse dots and a few accent pluses, kept clear of text and tags.
  function drawStars() {
    const keepOut = [...document.querySelectorAll("h1, .line, .cmd, .tag, .visual.factory, .visual.evals")].map((el) => {
      const r = el.getBoundingClientRect();
      return [r.left - 24, r.top - 24, r.right + 24, r.bottom + 24];
    });
    const clear = (x, y) => !keepOut.some(([l, t, r, b]) => x > l && x < r && y > t && y < b);
    const c = $("stars").getContext("2d");
    c.scale(2, 2);
    for (let i = 0; i < 90; i++) {
      const x = 470 + rand() * 540, y = 130 + rand() * 1130;
      if (!clear(x, y)) continue;
      c.fillStyle = `rgba(232,240,237,${0.2 + rand() * 0.45})`;
      c.fillRect(Math.round(x), Math.round(y), 2, 2);
    }
    c.fillStyle = "#62bfa8";
    for (let i = 0; i < 16; i++) {
      const x = Math.round(520 + rand() * 480), y = Math.round(140 + rand() * 1100);
      if (!clear(x, y)) continue;
      c.fillRect(x - 4, y, 9, 2); c.fillRect(x, y - 4, 2, 9);
    }
  }

  const icons = {
    braces: '<path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    database: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5M3 12a9 3 0 0 0 18 0"/>',
  };

  // Visual "orbit": a dithered orb (the agent) with an orbit; tags ride the orbit.
  const v = data.visual ?? {};
  if (v.type === "orbit") {
    const box = $("visual");
    const W = 904, H = 430, cx = W / 2, cy = H / 2, R = 168, rx = 372, ry = 96, tilt = -0.16;
    const canvas = document.createElement("canvas");
    canvas.width = W * 2; canvas.height = H * 2;
    box.append(canvas);
    const c = canvas.getContext("2d");
    c.scale(2, 2);

    const orbitPoint = (t) => {
      const x = rx * Math.cos(t), y = ry * Math.sin(t);
      return [cx + x * Math.cos(tilt) - y * Math.sin(tilt), cy + x * Math.sin(tilt) + y * Math.cos(tilt)];
    };
    const orbit = (from, to) => {
      c.beginPath();
      for (let t = from; t <= to + 1e-9; t += 0.01) {
        const [x, y] = orbitPoint(t);
        t === from ? c.moveTo(x, y) : c.lineTo(x, y);
      }
      c.strokeStyle = "rgba(98,191,168,.55)"; c.lineWidth = 1.2; c.stroke();
    };

    orbit(Math.PI, Math.PI * 2); // the far half, behind the orb

    // Ordered (Bayer 4x4) dithering of a lit sphere with a few craters.
    const bayer = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
    const L = [0.5, 0.5, 0.71];
    const craters = Array.from({ length: 14 }, () => [(rand() - 0.5) * 1.5, (rand() - 0.5) * 1.5, 0.06 + rand() * 0.14]);
    const cell = 4;
    for (let py = -R; py < R; py += cell) {
      for (let px = -R; px < R; px += cell) {
        const nx = px / R, ny = py / R, d2 = nx * nx + ny * ny;
        if (d2 > 1) continue;
        const nz = Math.sqrt(1 - d2);
        let light = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
        for (const [kx, ky, kr] of craters) {
          const dist = Math.hypot(nx - kx, ny - ky) / kr;
          if (dist < 0.8) light *= 0.55; else if (dist < 1) light = Math.min(1, light + 0.18);
        }
        const gx = ((px + R) / cell) & 3, gy = ((py + R) / cell) & 3;
        const t = (bayer[gy * 4 + gx] + 0.5) / 16;
        let color = null;
        if (light > t * 0.6 + 0.45) color = "#d8f1e9";
        else if (light > t) color = "#62bfa8";
        else if (light > t * 0.12) color = "#1c6b59";
        if (color) { c.fillStyle = color; c.fillRect(cx + px, cy + py, cell - 1, cell - 1); }
      }
    }
    c.beginPath(); c.arc(cx, cy, R + 12, 0, Math.PI * 2);
    c.strokeStyle = "rgba(98,191,168,.4)"; c.lineWidth = 1; c.stroke();

    orbit(0, Math.PI); // the near half, in front of the orb

    for (const tag of v.tags ?? []) {
      const [x, y] = orbitPoint(tag.at);
      const el = document.createElement("div");
      el.className = "tag";
      el.style.left = `${x}px`; el.style.top = `${y}px`;
      el.innerHTML = `<svg viewBox="0 0 24 24">${icons[tag.icon] ?? icons.check}</svg>${esc(tag.label)}`;
      box.append(el);
    }
  }
  // Visual "factory": a robotic arm over a conveyor, drawn as oblique line art with halftone shading.
  if (v.type === "factory") {
    const box = $("visual");
    box.classList.add("factory");
    const ink = "#0a0b0b", cream = "#e6ece9", creamTop = "#f4f7f5", wire = "#c9d3d0", dim = "#3a4441", acc = "#62bfa8";
    const DX = 0.55, DY = -0.35; // one unit of depth goes up and to the right
    const parts = [];
    const add = (svg) => parts.push(svg);
    const pts = (a) => a.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");

    // A solid block: lit top, halftone side, front face. (x, y) is the front bottom-left corner.
    const block = (x, y, w, h, d, opt = {}) => {
      const dx = d * DX, dy = d * DY, t = y - h;
      const side = pts([[x + w, y], [x + w, t], [x + w + dx, t + dy], [x + w + dx, y + dy]]);
      add(`<polygon points="${pts([[x, t], [x + w, t], [x + w + dx, t + dy], [x + dx, t + dy]])}" fill="${opt.top ?? creamTop}" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/>`);
      add(`<polygon points="${side}" fill="${cream}" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/>`);
      add(`<polygon points="${side}" fill="url(#dots)"/>`);
      add(`<rect x="${x}" y="${t}" width="${w}" height="${h}" fill="${opt.front ?? cream}" stroke="${ink}" stroke-width="2"/>`);
    };
    // A thick arm segment with a shaded underside.
    const limb = (a, b, wdt) => {
      add(`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${ink}" stroke-width="${wdt + 5}" stroke-linecap="round"/>`);
      add(`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${cream}" stroke-width="${wdt}" stroke-linecap="round"/>`);
      add(`<line x1="${a[0] + 5}" y1="${a[1] + 7}" x2="${b[0] + 5}" y2="${b[1] + 7}" stroke="url(#dots)" stroke-width="${wdt * 0.42}" stroke-linecap="round"/>`);
    };
    const joint = (c, r) => {
      add(`<circle cx="${c[0]}" cy="${c[1]}" r="${r + 6}" fill="${cream}" stroke="${ink}" stroke-width="2.5"/>`);
      add(`<circle cx="${c[0]}" cy="${c[1]}" r="${r}" fill="${acc}" stroke="${ink}" stroke-width="2.5"/>`);
    };

    const L0 = 30, L1 = 770, front = 328, depth = 70;
    const bdx = depth * DX, bdy = depth * DY;

    // A scanner gate across the belt: back post, beam, light, front post.
    const gate = (x) => {
      const top = 196;
      add(`<line x1="${x + bdx}" y1="${front + bdy}" x2="${x + bdx}" y2="${top + bdy}" stroke="${wire}" stroke-width="2"/>`);
      add(`<polygon points="${pts([[x - 4, top], [x + 4, top], [x + bdx + 4, top + bdy], [x + bdx - 4, top + bdy]])}" fill="${ink}" stroke="${wire}" stroke-width="2"/>`);
      for (let i = 0; i < 5; i++) {
        const lx = x + 8 + i * 6;
        add(`<line x1="${lx}" y1="${top + 4 + i * DY * -6}" x2="${lx}" y2="${front - 4}" stroke="${acc}" stroke-width="1.5" stroke-dasharray="2 5" opacity="${0.8 - i * 0.12}"/>`);
      }
      add(`<rect x="${x - 5}" y="${top}" width="10" height="${front + 28 - top}" fill="${ink}" stroke="${wire}" stroke-width="2"/>`);
      add(`<rect x="${x - 7}" y="${top - 12}" width="14" height="10" fill="${acc}" stroke="${wire}" stroke-width="1.5"/>`);
    };
    const label = (x, y, text, color) =>
      add(`<text x="${x}" y="${y}" font-family="Geist Mono, monospace" font-size="14" text-anchor="middle" fill="${color}">${esc(text)}</text>`);

    add(`<defs>
      <pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.25" fill="${ink}"/></pattern>
      <pattern id="ldots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${dim}"/></pattern>
      <pattern id="hazard" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="${acc}"/><rect x="8" width="8" height="16" fill="${ink}"/></pattern>
    </defs>`);

    // Floor shadow under the line.
    add(`<polygon points="${pts([[L0, front + 84], [L1, front + 84], [L1 + 60 * DX, front + 84 + 60 * DY], [L0 + 60 * DX, front + 84 + 60 * DY]])}" fill="url(#ldots)"/>`);

    // The arm stands behind the belt: base with hazard band, turret, then the limbs.
    const ax = 360;
    block(ax, 300, 150, 58, 70);
    add(`<rect x="${ax}" y="287" width="150" height="13" fill="url(#hazard)" stroke="${ink}" stroke-width="2"/>`);
    for (let i = 0; i < 4; i++) add(`<circle cx="${ax + 27 + i * 32}" cy="263" r="4.5" fill="${i === 0 ? acc : ink}"/>`);
    add(`<path d="M ${ax + 40} 238 L ${ax + 40} 200 A 44 14 0 0 1 ${ax + 128} 200 L ${ax + 128} 238 A 44 14 0 0 1 ${ax + 40} 238 Z" fill="${cream}" stroke="${ink}" stroke-width="2"/>`);
    add(`<path d="M ${ax + 100} 213 L ${ax + 126} 205 L ${ax + 126} 238 L ${ax + 100} 250 Z" fill="url(#dots)"/>`);
    add(`<ellipse cx="${ax + 84}" cy="200" rx="44" ry="14" fill="${creamTop}" stroke="${ink}" stroke-width="2"/>`);
    const shoulder = [ax + 84, 176], elbow = [ax + 168, 56], wrist = [ax + 250, 146];
    limb(shoulder, elbow, 34);
    limb(elbow, wrist, 26);
    joint(shoulder, 13);
    joint(elbow, 10);
    joint(wrist, 7);
    // Gripper.
    add(`<rect x="${wrist[0] - 24}" y="${wrist[1] + 14}" width="48" height="12" fill="${cream}" stroke="${ink}" stroke-width="2"/>`);
    for (const s of [-1, 1]) {
      const f = `M ${wrist[0] + s * 21} ${wrist[1] + 26} l ${s * 5} 24`;
      add(`<path d="${f}" stroke="${ink}" stroke-width="9" stroke-linecap="round"/>`);
      add(`<path d="${f}" stroke="${cream}" stroke-width="5" stroke-linecap="round"/>`);
    }

    // Conveyor in line art: belt top with slats, front band with rollers, legs.
    add(`<polygon points="${pts([[L0, front], [L1, front], [L1 + bdx, front + bdy], [L0 + bdx, front + bdy]])}" fill="${ink}" stroke="${wire}" stroke-width="2"/>`);
    for (let x = L0 + 18; x < L1; x += 18) add(`<line x1="${x}" y1="${front}" x2="${x + bdx}" y2="${front + bdy}" stroke="${dim}" stroke-width="1.5"/>`);
    add(`<polygon points="${pts([[L1, front], [L1 + bdx, front + bdy], [L1 + bdx, front + bdy + 20], [L1, front + 20]])}" fill="${ink}" stroke="${wire}" stroke-width="2"/>`);
    add(`<rect x="${L0}" y="${front}" width="${L1 - L0}" height="20" fill="${ink}" stroke="${wire}" stroke-width="2"/>`);
    for (let x = L0 + 14; x < L1; x += 28) add(`<circle cx="${x}" cy="${front + 10}" r="3.5" fill="none" stroke="${wire}" stroke-width="1.5"/>`);
    for (const x of [L0 + 40, 230, 420, 610, L1 - 40]) {
      add(`<path d="M ${x - 6} ${front + 20} V ${front + 84} H ${x - 16} M ${x + 6} ${front + 20} V ${front + 84} H ${x + 16}" fill="none" stroke="${wire}" stroke-width="2"/>`);
      add(`<circle cx="${x}" cy="${front + 46}" r="3" fill="none" stroke="${wire}" stroke-width="1.5"/>`);
    }
    add(`<rect x="${L0 - 14}" y="${front - 4}" width="14" height="28" fill="url(#hazard)" stroke="${wire}" stroke-width="1.5"/>`);

    // Input box on the belt, about to pass gate one.
    block(80, front - 6, 112, 58, 44);
    label(136, front - 29, v.input ?? "{ }", ink);
    gate(236);

    // The output box hangs in the gripper; a guide line marks where it lands.
    const ow = 124, ox = wrist[0] - ow / 2 - 6, oy = wrist[1] + 108;
    add(`<line x1="${wrist[0] + 4}" y1="${oy + 2}" x2="${wrist[0] + 4}" y2="${front - 8}" stroke="${acc}" stroke-width="1.5" stroke-dasharray="3 5"/>`);
    block(ox, oy, ow, 56, 44, { front: "#cfeee4" });
    label(ox + ow / 2, oy - 22, v.output ?? "{ }", "#0f6e5c");
    gate(724);

    // The store: a cylinder at the end of the line.
    const sx = 812, sy = 412, sw = 70;
    add(`<path d="M ${sx} ${sy} V ${sy - 108} A ${sw / 2} 12 0 0 1 ${sx + sw} ${sy - 108} V ${sy} A ${sw / 2} 12 0 0 1 ${sx} ${sy} Z" fill="${cream}" stroke="${ink}" stroke-width="2"/>`);
    add(`<path d="M ${sx + sw * 0.64} ${sy - 98} L ${sx + sw - 1} ${sy - 106} V ${sy} A ${sw / 2} 12 0 0 1 ${sx + sw * 0.64} ${sy + 11} Z" fill="url(#dots)"/>`);
    add(`<path d="M ${sx} ${sy - 72} A ${sw / 2} 12 0 0 0 ${sx + sw} ${sy - 72} V ${sy - 62} A ${sw / 2} 12 0 0 1 ${sx} ${sy - 62} Z" fill="${acc}" stroke="${ink}" stroke-width="2"/>`);
    add(`<path d="M ${sx} ${sy - 30} A ${sw / 2} 12 0 0 0 ${sx + sw} ${sy - 30}" fill="none" stroke="${ink}" stroke-width="2"/>`);
    add(`<ellipse cx="${sx + sw / 2}" cy="${sy - 108}" rx="${sw / 2}" ry="12" fill="${creamTop}" stroke="${ink}" stroke-width="2"/>`);

    box.insertAdjacentHTML("afterbegin", `<svg viewBox="0 0 904 470" aria-hidden="true">${parts.join("")}</svg>`);
    const tagAt = [[236, 120], [742, 120], [840, 250]];
    (v.tags ?? []).forEach((tag, i) => {
      const [x, y] = tag.xy ?? tagAt[i];
      const el = document.createElement("div");
      el.className = "tag";
      el.style.left = `${x}px`; el.style.top = `${y}px`;
      el.innerHTML = `<svg viewBox="0 0 24 24">${icons[tag.icon] ?? icons.check}</svg>${esc(tag.label)}`;
      box.append(el);
    });
  }

  // Visual "evals": a physical evaluation bench, with cases, twin score meters and a report.
  if (v.type === "evals") {
    const box = $("visual");
    box.classList.add("evals");
    const ink = "#0a0b0b", paper = "#e6ece9", top = "#f4f7f5", wire = "#c9d3d0", acc = "#62bfa8";
    const parts = [];

    box.innerHTML = `<svg viewBox="0 0 904 470" aria-hidden="true">${parts.join("")}</svg>`;
